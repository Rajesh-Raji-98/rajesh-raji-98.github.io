<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#f8fafc"/>
  <text x="40" y="58" fill="#0f172a" font-size="26" font-weight="700">From build to a verified, healthy deployment</text>
  <text x="40" y="90" fill="#475569" font-size="17">Every release and every incident ends with the full application flow checked</text>
  <g font-size="18">
    <rect x="40" y="130" width="190" height="120" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="135" y="176" text-anchor="middle" fill="#0f172a" font-weight="700">Build</text>
    <text x="135" y="204" text-anchor="middle" fill="#475569" font-size="15">image + Helm values</text>
    <text x="135" y="226" text-anchor="middle" fill="#475569" font-size="15">reviewed with diff</text>
    <rect x="270" y="130" width="190" height="120" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="365" y="176" text-anchor="middle" fill="#0f172a" font-weight="700">Deploy</text>
    <text x="365" y="204" text-anchor="middle" fill="#475569" font-size="15">ArgoCD (GitOps)</text>
    <text x="365" y="226" text-anchor="middle" fill="#475569" font-size="15">rolling update</text>
    <rect x="500" y="130" width="190" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="595" y="176" text-anchor="middle" fill="#1e3a8a" font-weight="700">Validate flow</text>
    <text x="595" y="204" text-anchor="middle" fill="#334155" font-size="15">pods, services, ingress</text>
    <text x="595" y="226" text-anchor="middle" fill="#334155" font-size="15">end-to-end request path</text>
    <rect x="730" y="130" width="190" height="120" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="825" y="176" text-anchor="middle" fill="#065f46" font-weight="700">Watch</text>
    <text x="825" y="204" text-anchor="middle" fill="#334155" font-size="15">metrics, logs, alerts</text>
    <text x="825" y="226" text-anchor="middle" fill="#334155" font-size="15">until stable</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"><path d="M230 190 L266 190"/><path d="M460 190 L496 190"/><path d="M690 190 L726 190"/></g>
  <rect x="40" y="290" width="880" height="150" rx="16" fill="#0f172a"/>
  <text x="70" y="330" fill="#38bdf8" font-size="19" font-weight="700">Kubernetes cluster</text>
  <g font-size="16" fill="#e2e8f0">
    <rect x="70" y="350" width="150" height="60" rx="10" fill="#1e293b"/><text x="145" y="386" text-anchor="middle">Nodes</text>
    <rect x="236" y="350" width="150" height="60" rx="10" fill="#1e293b"/><text x="311" y="386" text-anchor="middle">Pods &amp; probes</text>
    <rect x="402" y="350" width="150" height="60" rx="10" fill="#1e293b"/><text x="477" y="386" text-anchor="middle">Calico network</text>
    <rect x="568" y="350" width="150" height="60" rx="10" fill="#1e293b"/><text x="643" y="386" text-anchor="middle">Storage / PVC</text>
    <rect x="734" y="350" width="156" height="60" rx="10" fill="#1e293b"/><text x="812" y="386" text-anchor="middle">Ingress / Nginx</text>
  </g>
  <rect x="40" y="466" width="880" height="44" rx="10" fill="#e0f2fe"/>
  <text x="480" y="494" text-anchor="middle" fill="#075985" font-size="17" font-weight="600">After any server or deployment change: re-check the whole flow, not just "pods are running"</text>
</svg>
