<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect width="960" height="540" rx="18" fill="#f8fafc"/>
  <text x="40" y="58" fill="#0f172a" font-size="26" font-weight="700">One emergency call, one trace</text>
  <text x="40" y="90" fill="#475569" font-size="17">Each bar is one hop of the I999 incident call, with its own timing</text>
