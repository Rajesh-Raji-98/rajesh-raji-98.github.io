  <g font-size="17" fill="#0f172a">
    <text x="40" y="146">API gateway</text>
    <text x="56" y="188">WSO2 ESB</text>
    <text x="72" y="230">Vault config</text>
    <text x="72" y="272">IoT ops + Redis</text>
    <text x="72" y="314">Command centre</text>
    <text x="56" y="356" fill="#b45309" font-weight="600">Reply to caller</text>
    <text x="56" y="414" fill="#6d28d9">Recommendation</text>
    <text x="72" y="456" fill="#6d28d9">GIS + workforce</text>
  </g>
  <rect x="300" y="128" width="600" height="24" rx="6" fill="#2563eb"/>
  <rect x="324" y="170" width="380" height="24" rx="6" fill="#3b82f6"/>
  <rect x="344" y="212" width="52" height="24" rx="6" fill="#10b981"/>
