  <rect x="662" y="338" width="34" height="24" rx="6" fill="#f59e0b"/>
  <line x1="40" y1="378" x2="920" y2="378" stroke="#cbd5e1" stroke-dasharray="6 6"/>
  <rect x="490" y="396" width="380" height="24" rx="6" fill="#8b5cf6"/>
  <rect x="550" y="438" width="260" height="24" rx="6" fill="#a78bfa"/>
  <rect x="40" y="484" width="880" height="38" rx="10" fill="#ede9fe"/>
