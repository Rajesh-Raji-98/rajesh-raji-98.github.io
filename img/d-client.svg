<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#f8fafc"/>
  <text x="40" y="58" fill="#0f172a" font-size="26" font-weight="700">Fix it, find why, make sure it never repeats</text>
  <text x="40" y="90" fill="#475569" font-size="17">How I handle a client issue from first report to permanent improvement</text>
  <g font-size="18">
    <rect x="40" y="130" width="200" height="130" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="140" y="178" text-anchor="middle" fill="#0f172a" font-weight="700">1 · Restore</text>
    <text x="140" y="206" text-anchor="middle" fill="#475569" font-size="15">bring the service back</text>
    <text x="140" y="228" text-anchor="middle" fill="#475569" font-size="15">keep the client updated</text>
    <rect x="266" y="130" width="200" height="130" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="366" y="178" text-anchor="middle" fill="#0f172a" font-weight="700">2 · Root cause</text>
    <text x="366" y="206" text-anchor="middle" fill="#475569" font-size="15">logs, metrics, traces</text>
    <text x="366" y="228" text-anchor="middle" fill="#475569" font-size="15">find every cause</text>
    <rect x="492" y="130" width="200" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="592" y="178" text-anchor="middle" fill="#1e3a8a" font-weight="700">3 · Enhance</text>
    <text x="592" y="206" text-anchor="middle" fill="#334155" font-size="15">self-healing, automation</text>
    <text x="592" y="228" text-anchor="middle" fill="#334155" font-size="15">early-warning alerts</text>
    <rect x="718" y="130" width="202" height="130" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="819" y="178" text-anchor="middle" fill="#065f46" font-weight="700">4 · Share</text>
    <text x="819" y="206" text-anchor="middle" fill="#334155" font-size="15">RCA + runbook</text>
    <text x="819" y="228" text-anchor="middle" fill="#334155" font-size="15">for the whole team</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"><path d="M240 195 L262 195"/><path d="M466 195 L488 195"/><path d="M692 195 L714 195"/></g>
  <text x="40" y="320" fill="#0f172a" font-size="20" font-weight="700">Typical work</text>
  <g font-size="16">
    <rect x="40" y="340" width="280" height="64" rx="12" fill="#fef2f2" stroke="#fca5a5"/><text x="180" y="378" text-anchor="middle" fill="#991b1b" font-weight="600">Security exposure closed</text>
    <rect x="340" y="340" width="280" height="64" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="480" y="378" text-anchor="middle" fill="#9a3412" font-weight="600">Disk / storage risk caught early</text>
    <rect x="640" y="340" width="280" height="64" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="780" y="378" text-anchor="middle" fill="#1e3a8a" font-weight="600">Service now auto-recovers</text>
    <rect x="40" y="420" width="280" height="64" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="180" y="458" text-anchor="middle" fill="#166534" font-weight="600">Certificate expiry automated</text>
    <rect x="340" y="420" width="280" height="64" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="480" y="458" text-anchor="middle" fill="#5b21b6" font-weight="600">Vendor endpoint checks</text>
    <rect x="640" y="420" width="280" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="780" y="458" text-anchor="middle" fill="#334155" font-weight="600">Log retention automated</text>
  </g>
