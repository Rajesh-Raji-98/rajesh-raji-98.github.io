<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="sev" x1="0" x2="1"><stop offset="0" stop-color="#10b981"/><stop offset=".69" stop-color="#10b981"/><stop offset=".7" stop-color="#f59e0b"/><stop offset=".79" stop-color="#f59e0b"/><stop offset=".8" stop-color="#f97316"/><stop offset=".89" stop-color="#f97316"/><stop offset=".9" stop-color="#ef4444"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect width="960" height="540" rx="18" fill="#f8fafc"/>
  <text x="40" y="58" fill="#0f172a" font-size="26" font-weight="700">Catch it at 70%, not at 100%</text>
  <text x="40" y="90" fill="#475569" font-size="17">How every production alert across 20–25 live projects is handled</text>

  <rect x="40" y="122" width="880" height="34" rx="17" fill="url(#sev)"/>
  <g font-size="17" font-weight="600">
    <text x="60" y="186" fill="#047857">Healthy</text>
    <text x="656" y="186" fill="#b45309">Warning 70%</text>
    <text x="745" y="214" fill="#c2410c">Critical 80%</text>
    <text x="836" y="186" fill="#b91c1c">Disaster 90%</text>
  </g>

  <g font-size="18">
    <rect x="40" y="262" width="200" height="110" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="140" y="304" text-anchor="middle" fill="#0f172a" font-weight="700">Monitoring</text>
    <text x="140" y="330" text-anchor="middle" fill="#475569" font-size="15">Prometheus · Grafana</text>
    <text x="140" y="352" text-anchor="middle" fill="#475569" font-size="15">ELK · Uptime Kuma</text>

    <rect x="280" y="262" width="180" height="110" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="370" y="304" text-anchor="middle" fill="#0f172a" font-weight="700">Alert fires</text>
    <text x="370" y="330" text-anchor="middle" fill="#475569" font-size="15">email · Telegram</text>
    <text x="370" y="352" text-anchor="middle" fill="#475569" font-size="15">by severity</text>

    <rect x="500" y="262" width="180" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="590" y="304" text-anchor="middle" fill="#1e3a8a" font-weight="700">Jira ticket</text>
    <text x="590" y="330" text-anchor="middle" fill="#334155" font-size="15">auto-created</text>
    <text x="590" y="352" text-anchor="middle" fill="#334155" font-size="15">with context</text>

    <rect x="720" y="262" width="200" height="110" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="820" y="304" text-anchor="middle" fill="#065f46" font-weight="700">Fixed or assigned</text>
    <text x="820" y="330" text-anchor="middle" fill="#334155" font-size="15">followed up</text>
    <text x="820" y="352" text-anchor="middle" fill="#334155" font-size="15">and closed</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"><path d="M240 317 L276 317"/><path d="M460 317 L496 317"/><path d="M680 317 L716 317"/></g>

  <rect x="40" y="420" width="880" height="84" rx="14" fill="#0f172a"/>
  <text x="480" y="456" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="600">Problems fixed at the warning stage, before they become incidents</text>
  <text x="480" y="484" text-anchor="middle" fill="#38bdf8" font-size="16">that affect the company SLO</text>
</svg>
